# Builds the APKs on GitHub's runners (official Android SDK + Maven), runs the unit tests, then:
#  - attaches the APKs and the build log to the run (Actions tab -> run -> Artifacts),
#  - publishes them on the "apk" branch so they can be downloaded directly from the repository.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue --stacktrace \
            :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build-log.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fluide-player
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            build-log.txt
          if-no-files-found: warn

      - name: Publish to the apk branch
        if: always()
        env:
          OUTCOME: ${{ steps.build.outcome }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish
          cp app/build/outputs/apk/release/app-release.apk publish/fluide-player-release.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk publish/fluide-player-debug.apk 2>/dev/null || true
          tail -c 3000000 build-log.txt > publish/build-log.txt 2>/dev/null || true
          printf '%s %s\n' "$OUTCOME" "$GITHUB_SHA" > publish/STATUS.txt
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b apk
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}: $OUTCOME [skip ci]"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
